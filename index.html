<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MGI Ultimate</title>
    
    <!-- 部品の読み込み（cdn.jsdelivr.net を使用して安定性を最大化） -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/lib/Recharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase (最も安定する旧形式) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #F8FAFB; -webkit-tap-highlight-color: transparent; }
        .main-title { font-family: 'Playfair Display', serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.1); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root">
        <div id="loader" style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#F8FAFB; color:#455A64;">
            <div style="width:32px; height:32px; border:3px solid #D4AF37; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div>
            <p id="st-msg" style="margin-top:16px; font-size:12px; font-weight:bold; letter-spacing:0.1em;">CONNECTING SYSTEM...</p>
        </div>
    </div>

    <script type="text/babel">
        // 起動チェック関数
        const initApp = () => {
            // Rechartsがなくてもアプリ自体は開くようにする
            if (!window.React || !window.lucide) {
                setTimeout(initApp, 500);
                return;
            }

            const { useState, useMemo, useEffect } = React;
            // グラフ部品があるか確認
            const Re = window.Recharts || null;

            const firebaseConfig = { 
                apiKey: "AIzaSyBmq8Y8LiGU_HGmyiCFEjt8rN-enPn5zzw", 
                authDomain: "mgi-pocket.firebaseapp.com",
                projectId: "mgi-pocket",
                storageBucket: "mgi-pocket.firebasestorage.app",
                messagingSenderId: "461429650252",
                appId: "1:461429650252:web:2876c556e4f2bbfe5fd5e9"
            };
            const MGI_ID = 'mgi-ultimate-v1';

            const ASSET_CATEGORIES = {
                '生活防衛資金': { color: '#455A64', label: '防衛', icon: 'wallet' },
                '現金': { color: '#B2EBF2', label: '現金', icon: 'banknote' },
                '株式': { color: '#D4AF37', label: '株式', icon: 'trending-up' },
                '老後資金': { color: '#5C6BC0', label: '老後', icon: 'coffee' },
                '不動産': { color: '#FF7043', label: '不動産', icon: 'building-2' },
                '暗号資産': { color: '#9575CD', label: '暗号', icon: 'bitcoin' },
                'ゴールド': { color: '#FDD835', label: '金', icon: 'gem' }
            };

            const Icon = ({ name, className = "w-5 h-5" }) => {
                useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
                return <i data-lucide={name} className={className}></i>;
            };

            const App = () => {
                const [user, setUser] = useState(null);
                const [activeTab, setActiveTab] = useState('assets');
                const [loading, setLoading] = useState(true);
                const [assets, setAssets] = useState([]);

                useEffect(() => {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    const auth = firebase.auth();
                    const db = firebase.firestore();

                    return auth.onAuthStateChanged((u) => {
                        if (u) {
                            setUser(u);
                            db.collection('artifacts').doc(MGI_ID).collection('users').doc(u.uid).collection('assets')
                              .onSnapshot(s => {
                                  setAssets(s.docs.map(d => ({id: d.id, ...d.data()})));
                                  setLoading(false);
                                  const l = document.getElementById('loader');
                                  if (l) l.style.display = 'none';
                              });
                        } else {
                            auth.signInAnonymously();
                        }
                    });
                }, []);

                const totals = useMemo(() => assets.reduce((acc, curr) => {
                    const amt = Number(curr.amount) || 0;
                    acc[curr.category] = (acc[curr.category] || 0) + amt;
                    acc.total += amt;
                    return acc;
                }, { total: 0 }), [assets]);

                if (loading) return null;

                return (
                    <div className="max-w-md mx-auto min-h-screen pb-32 relative animate-pop">
                        <header className="p-6 pt-10 flex justify-between items-end sticky top-0 bg-[#F8FAFB]/95 backdrop-blur-md z-40">
                            <div>
                                <h1 className="text-2xl font-bold text-[#455A64] main-title">Money Grow IG</h1>
                                <div className="flex items-center gap-1 mt-1 text-emerald-500">
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                                    <span className="text-[8px] font-bold uppercase tracking-widest">Active</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">Total</p>
                                <p className="text-xl font-bold text-[#455A64]">{(totals.total/10000).toLocaleString()}万</p>
                            </div>
                        </header>

                        <main className="px-5 mt-4">
                            <div className="bg-white p-6 rounded-[40px] shadow-sm border border-gray-100 flex items-center gap-6">
                                <div className="w-24 h-24 shrink-0 flex items-center justify-center">
                                    {Re ? (
                                        <ResponsiveContainer width="100%" height="100%">
                                            <Re.PieChart>
                                                <Re.Pie data={Object.keys(ASSET_CATEGORIES).map(cat=>({name:cat, value:totals[cat]||0}))} innerRadius={25} outerRadius={40} paddingAngle={4} dataKey="value" stroke="none">
                                                    {Object.keys(ASSET_CATEGORIES).map((cat, i) => <Re.Cell key={i} fill={ASSET_CATEGORIES[cat].color} />)}
                                                </Re.Pie>
                                            </Re.PieChart>
                                        </ResponsiveContainer>
                                    ) : (
                                        <div className="w-full h-full bg-gray-50 rounded-full flex items-center justify-center text-[#D4AF37]">
                                            <Icon name="pie-chart" />
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1 space-y-1">
                                    {Object.entries(ASSET_CATEGORIES).map(([name, info]) => (
                                        totals[name] > 0 && (
                                            <div key={name} className="flex items-center justify-between">
                                                <span className="text-[8px] font-bold text-gray-400 uppercase">{info.label}</span>
                                                <span className="text-[10px] font-bold text-[#455A64]">{Math.round(totals[name]/totals.total*100)}%</span>
                                            </div>
                                        )
                                    ))}
                                </div>
                            </div>

                            <div className="mt-8 space-y-2">
                                {assets.map(a => (
                                    <div key={a.id} className="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-gray-50">
                                        <div className="flex items-center gap-3">
                                            <div className="p-2.5 rounded-2xl" style={{backgroundColor: ASSET_CATEGORIES[a.category].color+'15', color: ASSET_CATEGORIES[a.category].color}}><Icon name={ASSET_CATEGORIES[a.category].icon} /></div>
                                            <div className="text-sm font-bold text-[#455A64]">{a.name}</div>
                                        </div>
                                        <span className="font-bold text-[#455A64]">{(a.amount/10000).toLocaleString()}万</span>
                                    </div>
                                ))}
                                <p className="text-center text-[10px] text-gray-300 mt-6 font-bold tracking-[0.2em] uppercase">— Strategic Wealth Management —</p>
                            </div>
                        </main>

                        <nav className="fixed bottom-6 left-6 right-6 h-20 glass-nav rounded-[32px] shadow-2xl flex items-center justify-around px-4 z-50">
                            <button onClick={()=>setActiveTab('assets')} className="text-[#D4AF37]"><Icon name="list" /></button>
                            <button className="text-gray-300"><Icon name="banknote" /></button>
                            <button className="text-gray-300"><Icon name="trending-up" /></button>
                        </nav>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        // 起動
        initApp();
    </script>
</body>
</html>
